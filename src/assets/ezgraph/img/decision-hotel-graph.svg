<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">DecisionHotelGraph node transitions</title>
  <desc id="desc">RouterDecisionNode routes to five criterion collectors, which return to the router after a capture or reroute. An exact search request goes to CriteriaReadinessDecisionNode, then to the deterministic SearchHotelsNode. No matches return to the router with a notice; results enter PresentNode, which publishes a draft to PresentationDecisionNode and receives either the draft or a grounded rendering back. PresentNode books with finish or sends a revision to the router.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#18242e"/><stop offset="1" stop-color="#0d1218"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#54bee8"/><stop offset="1" stop-color="#6979e9"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c28cf4"/><stop offset="1" stop-color="#8964dd"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 8 4.5 0 9Z" fill="#97a9b8"/></marker>
    <marker id="arrow-amber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 8 4.5 0 9Z" fill="#f5c76d"/></marker>
    <marker id="arrow-rose" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 8 4.5 0 9Z" fill="#ff8f86"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".28"/></filter>
  </defs>

  <rect width="1200" height="760" rx="30" fill="url(#bg)"/>
  <text x="44" y="58" fill="#f3f7fa" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">DecisionHotelGraph</text>
  <text x="44" y="87" fill="#9cafbe" font-family="Inter,Arial,sans-serif" font-size="15">Jev decision nodes choose among declared labels; application code owns every transition, search, and booking.</text>

  <!-- history-space lanes -->
  <g fill="#ffffff" fill-opacity=".025" stroke="#2b3b49" stroke-width="1.5">
    <rect x="30" y="108" width="720" height="560" rx="22"/>
    <rect x="770" y="108" width="400" height="560" rx="22"/>
  </g>
  <g font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#7f8ea3" letter-spacing="1">
    <text x="50" y="654">HISTORY SPACE · hotel-intake</text>
    <text x="790" y="654">HISTORY SPACE · hotel-present</text>
  </g>

  <!-- solid transitions -->
  <g fill="none" stroke="#97a9b8" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M310 330H400"/>
    <path d="M400 188H446"/><path d="M400 250H446"/><path d="M400 312H446"/><path d="M400 374H446"/><path d="M400 436H446"/>
    <path d="M185 390V516"/>
    <path d="M345 570H446"/>
    <path d="M710 570H790V300H816"/>
    <path d="M920 350V496"/>
    <path d="M970 250V214"/>
  </g>
  <path d="M400 188V436" fill="none" stroke="#97a9b8" stroke-width="2.5"/>

  <!-- returns to the router -->
  <g fill="none" stroke="#f5c76d" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrow-amber)">
    <path d="M580 160C580 142 240 150 240 286"/>
    <path d="M1020 498V354"/>
    <path d="M850 250V122H95V286"/>
  </g>
  <path d="M480 528C480 470 330 470 314 376" fill="none" stroke="#ff8f86" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrow-rose)"/>

  <!-- nodes -->
  <g filter="url(#shadow)">
    <rect x="60" y="290" width="250" height="100" rx="16" fill="url(#purple)"/>
    <rect x="45" y="520" width="300" height="100" rx="16" fill="url(#purple)"/>
    <rect x="820" y="500" width="300" height="100" rx="16" fill="url(#purple)"/>
    <g fill="url(#blue)">
      <rect x="450" y="163" width="260" height="50" rx="12"/>
      <rect x="450" y="225" width="260" height="50" rx="12"/>
      <rect x="450" y="287" width="260" height="50" rx="12"/>
      <rect x="450" y="349" width="260" height="50" rx="12"/>
      <rect x="450" y="411" width="260" height="50" rx="12"/>
      <rect x="820" y="250" width="300" height="100" rx="16"/>
    </g>
    <rect x="450" y="530" width="260" height="80" rx="16" fill="#f4c866"/>
    <rect x="880" y="152" width="180" height="60" rx="14" fill="#4cbf9f"/>
  </g>

  <g font-family="Inter,Arial,sans-serif" text-anchor="middle">
    <g fill="#fff" font-size="17" font-weight="700">
      <text x="185" y="334">RouterDecisionNode</text>
      <text x="195" y="564" font-size="16">CriteriaReadinessDecisionNode</text>
      <text x="970" y="544">PresentationDecisionNode</text>
      <text x="970" y="294">PresentNode</text>
    </g>
    <g fill="#fff" font-size="15" font-weight="700">
      <text x="580" y="193">DateRangeNode</text>
      <text x="580" y="255">BudgetNode</text>
      <text x="580" y="317">RoomTypeNode</text>
      <text x="580" y="379">AmenityNode</text>
      <text x="580" y="441">DistanceNode</text>
      <text x="970" y="187">finish() · booked</text>
    </g>
    <text x="580" y="566" fill="#27313d" font-size="17" font-weight="700">SearchHotelsNode</text>
    <g font-size="13">
      <text x="185" y="360" fill="#f5ecfb">Jev · two choice questions</text>
      <text x="195" y="590" fill="#f5ecfb">Jev · choice + noul</text>
      <text x="970" y="570" fill="#f5ecfb">Jev · noul + two scores</text>
      <text x="970" y="320" fill="#e7f4fb">forced tool call: draft, book, revise</text>
      <text x="580" y="590" fill="#70561b">catalog filter + pricing · no model</text>
    </g>
  </g>

  <!-- edge labels -->
  <g font-family="Inter,Arial,sans-serif" font-size="13" fill="#d6e0e8">
    <text x="318" y="320">set/revise</text>
    <text x="196" y="458">exact “search”</text>
    <text x="196" y="476">+ no issues</text>
    <text x="352" y="560">ready ≥ 0.75</text>
    <text x="718" y="560">results</text>
    <text x="912" y="428" text-anchor="end">publish_hotel_draft</text>
    <text x="980" y="238">chosen_hotel</text>
  </g>
  <g font-family="Inter,Arial,sans-serif" font-size="13" fill="#f5c76d">
    <text x="232" y="212" text-anchor="end">capture or</text>
    <text x="232" y="229" text-anchor="end">reroute_request</text>
    <text x="1028" y="420">directTo: accepted</text>
    <text x="1028" y="438">draft or grounded</text>
    <text x="1028" y="456">rendering</text>
    <text x="838" y="144" text-anchor="end">revise_search · forwards the customer’s request</text>
  </g>
  <text x="492" y="500" font-family="Inter,Arial,sans-serif" font-size="13" fill="#ff8f86">no matches · notice</text>

  <!-- legend -->
  <g font-family="Inter,Arial,sans-serif" font-size="13" fill="#d6e0e8">
    <rect x="44" y="694" width="16" height="16" rx="4" fill="url(#purple)"/><text x="68" y="707">DecisionNode (Jev)</text>
    <rect x="214" y="694" width="16" height="16" rx="4" fill="url(#blue)"/><text x="238" y="707">ConversationNode</text>
    <rect x="378" y="694" width="16" height="16" rx="4" fill="#f4c866"/><text x="402" y="707">GraphNode, no model</text>
    <rect x="554" y="694" width="16" height="16" rx="4" fill="#4cbf9f"/><text x="578" y="707">graph completes</text>
    <text x="44" y="738" fill="#9cafbe">Not drawn: any ConversationNode can call terminate_session → TerminateSessionNode (hotel-terminal) → END. Router “exit” completes with finish().</text>
  </g>
</svg>
