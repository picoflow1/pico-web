<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">QuoteGraph node transitions</title>
  <desc id="desc">DriverNode moves to VehicleNode, which resolves the vehicle against a local catalog and moves to HistoryNode in its own history space. HistoryNode moves to CoverageNode, which rates the quote and enters QuoteNode in the presentation history space. QuoteNode adjusts the quote directly, sends a revision back to CoverageNode, or accepts a tier with finish().</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#18242e"/><stop offset="1" stop-color="#0d1218"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#54bee8"/><stop offset="1" stop-color="#6979e9"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 8 4.5 0 9Z" fill="#97a9b8"/></marker>
    <marker id="arrow-amber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 8 4.5 0 9Z" fill="#f5c76d"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".28"/></filter>
  </defs>

  <rect width="1200" height="780" rx="30" fill="url(#bg)"/>
  <text x="44" y="58" fill="#f3f7fa" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">QuoteGraph</text>
  <text x="44" y="87" fill="#9cafbe" font-family="Inter,Arial,sans-serif" font-size="15">Each stage validates and owns its facts; the rating engine prices in code; only a current tier can be accepted.</text>

  <!-- history-space lanes -->
  <g fill="#ffffff" fill-opacity=".025" stroke="#2b3b49" stroke-width="1.5">
    <rect x="30" y="108" width="1140" height="215" rx="22"/>
    <rect x="30" y="335" width="1140" height="140" rx="22"/>
    <rect x="30" y="487" width="1140" height="200" rx="22"/>
  </g>
  <g font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#7f8ea3" letter-spacing="1">
    <text x="50" y="132">HISTORY SPACE · quote-intake</text>
    <text x="50" y="462">HISTORY SPACE · quote-incidents</text>
    <text x="50" y="674">HISTORY SPACE · quote-present</text>
  </g>

  <!-- transitions -->
  <g fill="none" stroke="#97a9b8" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M280 215H326"/>
    <path d="M460 260V405H616"/>
    <path d="M840 405H920V264"/>
    <path d="M960 260V526"/>
    <path d="M900 628H826"/>
  </g>
  <g fill="none" stroke="#f5c76d" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrow-amber)">
    <path d="M1110 530V264"/>
    <path d="M1070 640C1070 676 1120 676 1120 644"/>
  </g>
  <g fill="none" stroke="#6f8292" stroke-width="2" stroke-dasharray="3 6">
    <path d="M380 260C380 320 230 310 230 363"/>
    <path d="M560 552H896"/>
  </g>

  <!-- nodes -->
  <g filter="url(#shadow)">
    <g fill="url(#blue)">
      <rect x="60" y="170" width="220" height="90" rx="16"/>
      <rect x="330" y="170" width="260" height="90" rx="16"/>
      <rect x="620" y="360" width="220" height="90" rx="16"/>
      <rect x="900" y="170" width="240" height="90" rx="16"/>
      <rect x="900" y="530" width="240" height="110" rx="16"/>
    </g>
    <rect x="60" y="365" width="230" height="70" rx="14" fill="#f4c866"/>
    <rect x="330" y="517" width="230" height="70" rx="14" fill="#f4c866"/>
    <rect x="640" y="600" width="182" height="56" rx="14" fill="#4cbf9f"/>
  </g>

  <g font-family="Inter,Arial,sans-serif" text-anchor="middle">
    <g fill="#fff" font-size="18" font-weight="700">
      <text x="170" y="210">DriverNode</text>
      <text x="460" y="210">VehicleNode</text>
      <text x="730" y="400">HistoryNode</text>
      <text x="1020" y="210">CoverageNode</text>
      <text x="1020" y="575">QuoteNode</text>
    </g>
    <g font-size="13" fill="#e7f4fb">
      <text x="170" y="236">capture_driver</text>
      <text x="460" y="236">resolve_vehicle · capture_vehicle_use</text>
      <text x="730" y="426">capture_history</text>
      <text x="1020" y="236">select_coverage</text>
      <text x="1020" y="600">adjust_quote · accept_quote</text>
      <text x="1020" y="618">revise_coverage</text>
    </g>
    <g fill="#27313d">
      <text x="175" y="396" font-size="16" font-weight="700">VehicleCatalog</text>
      <text x="175" y="418" font-size="12" fill="#70561b">12 ratable vehicles · no model</text>
      <text x="445" y="548" font-size="16" font-weight="700">RatingEngine</text>
      <text x="445" y="570" font-size="12" fill="#70561b">select_coverage · adjust_quote</text>
    </g>
    <text x="731" y="633" fill="#fff" font-size="15" font-weight="700">finish() · accepted</text>
  </g>

  <!-- edge labels -->
  <g font-family="Inter,Arial,sans-serif" font-size="13" fill="#d6e0e8">
    <text x="303" y="203" text-anchor="middle">go()</text>
    <text x="476" y="396">go() + stage message</text>
    <text x="846" y="396">message</text>
    <text x="846" y="380">go() +</text>
    <text x="952" y="506" text-anchor="end">go() + seeded tiers</text>
    <text x="862" y="618" text-anchor="middle">accept</text>
  </g>
  <g font-family="Inter,Arial,sans-serif" font-size="13" fill="#f5c76d">
    <text x="1102" y="378" text-anchor="end">revise_coverage</text>
    <text x="1102" y="396" text-anchor="end">forwards request</text>
    <text x="1062" y="672" text-anchor="end">adjust_quote → direct()</text>
  </g>
  <g font-family="Inter,Arial,sans-serif" font-size="12" fill="#9cafbe">
    <text x="620" y="544">prices tiers in code</text>
  </g>

  <!-- legend -->
  <g font-family="Inter,Arial,sans-serif" font-size="13" fill="#d6e0e8">
    <rect x="44" y="706" width="16" height="16" rx="4" fill="url(#blue)"/><text x="68" y="719">ConversationNode</text>
    <rect x="210" y="706" width="16" height="16" rx="4" fill="#f4c866"/><text x="234" y="719">plain TypeScript, no model</text>
    <rect x="428" y="706" width="16" height="16" rx="4" fill="#4cbf9f"/><text x="452" y="719">graph completes</text>
    <text x="44" y="750" fill="#9cafbe">Not drawn: any node returns stay() on a rejected tool call and keeps collecting; terminate_session → TerminateSessionNode (quote-terminal) → END.</text>
  </g>
</svg>
