  <g filter="url(#shadow)"><rect x="68" y="200" width="137" height="100" rx="18" fill="url(#blue)"/><rect x="268" y="200" width="137" height="100" rx="18" fill="#314958" stroke="#7b99ab" stroke-width="2"/><rect x="468" y="200" width="137" height="100" rx="18" fill="#314958" stroke="#7b99ab" stroke-width="2"/><rect x="668" y="200" width="137" height="100" rx="18" fill="#c18cf4"/><rect x="868" y="200" width="137" height="100" rx="18" fill="#5bb7d9"/><rect x="668" y="430" width="137" height="100" rx="18" fill="#5bb7d9"/><rect x="468" y="430" width="137" height="100" rx="18" fill="#5bb7d9"/><rect x="268" y="430" width="137" height="100" rx="18" fill="#5bb7d9"/><rect x="68" y="430" width="137" height="100" rx="18" fill="#f4c866"/><rect x="68" y="610" width="137" height="70" rx="18" fill="#4cbf9f"/></g>
  <g font-family="Inter,Arial,sans-serif" text-anchor="middle"><g fill="#fff" font-size="16" font-weight="700"><text x="136" y="242">Weather</text><text x="336" y="242">FooLogic</text><text x="536" y="242">GooLogic</text><text x="736" y="242">Favorites</text><text x="936" y="242">Name</text><text x="736" y="472">DOB</text><text x="536" y="472">Address</text><text x="336" y="472">Terminal</text><text x="136" y="472" fill="#27313d">Nested work</text><text x="136" y="652">Complete</text></g><g font-size="11"><text x="136" y="267" fill="#e7f4fb">tool batch + stay</text><text x="336" y="267" fill="#dce9f1">no LLM</text><text x="536" y="267" fill="#dce9f1">no LLM</text><text x="736" y="267" fill="#f5ecfb">onResponse</text><text x="936" y="267" fill="#e7f4fb">Zod tool</text><text x="736" y="497" fill="#e7f4fb">cross-state</text><text x="536" y="497" fill="#e7f4fb">validator</text><text x="136" y="497" fill="#70561b">runStep / runSteps</text></g></g>
