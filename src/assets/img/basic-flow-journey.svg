<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">BasicFlow profile journey</title><desc id="desc">BasicFlow branches at initial step to a President shortcut or follows Weather to two LogicSteps, Favorites, Name, nested child work, Date of Birth, Address, and the terminal step.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#18242e"/><stop offset="1" stop-color="#0d1218"/></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#54bee8"/><stop offset="1" stop-color="#6979e9"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 8 4.5 0 9Z" fill="#97a9b8"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#000" flood-opacity=".28"/></filter></defs>
  <rect width="1200" height="720" rx="30" fill="url(#bg)"/><g fill="none" stroke="#2b3b49" opacity=".7"><path d="M0 120H1200M0 240H1200M0 360H1200M0 480H1200M0 600H1200"/><path d="M120 0V720M240 0V720M360 0V720M480 0V720M600 0V720M720 0V720M840 0V720M960 0V720M1080 0V720"/></g>
  <text x="54" y="64" fill="#f3f7fa" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700">BasicFlow profile journey</text><text x="54" y="94" fill="#9cafbe" font-family="Inter,Arial,sans-serif" font-size="16">A broad framework tour: one durable profile path, deterministic workers, response-driven routing, and nested children.</text>
  <g fill="none" stroke="#97a9b8" stroke-width="3" marker-end="url(#arrow)"><path d="M205 250H268"/><path d="M405 250H468"/><path d="M605 250H668"/><path d="M805 250H868"/><path d="M936 300V365H736V430"/><path d="M668 480H605"/><path d="M468 480H405"/><path d="M336 530V645H205"/></g>
