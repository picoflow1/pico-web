<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">InvoiceFlow one-shot extraction journey</title>
  <desc id="desc">A POST request enters NoToolStep, routes to ExtractInvoiceStep, which uploads the configured file and re-enters itself with a multimodal message before returning a JSON HTTP response.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#18242e"/><stop offset="1" stop-color="#0d1218"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#54bee8"/><stop offset="1" stop-color="#6979e9"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 8 4.5 0 9Z" fill="#97a9b8"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#000" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1200" height="620" rx="30" fill="url(#bg)"/>
  <g fill="none" stroke="#2b3b49" opacity=".7"><path d="M0 120H1200M0 240H1200M0 360H1200M0 480H1200"/><path d="M120 0V620M240 0V620M360 0V620M480 0V620M600 0V620M720 0V620M840 0V620M960 0V620M1080 0V620"/></g>
  <text x="54" y="64" fill="#f3f7fa" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700">InvoiceFlow extraction journey</text>
  <text x="54" y="94" fill="#9cafbe" font-family="Inter,Arial,sans-serif" font-size="16">One HTTP request names a bundled file. The extractor re-enters with a multimodal message, then returns typed JSON.</text>
  <g fill="none" stroke="#97a9b8" stroke-width="3" marker-end="url(#arrow)"><path d="M265 260H345"/><path d="M550 260H630"/><path d="M870 260H945"/></g>
  <path d="M870 260C950 260 950 470 750 470C570 470 550 360 630 310" fill="none" stroke="#f5c76d" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="60" y="200" width="205" height="120" rx="18" fill="url(#blue)"/>
    <rect x="345" y="200" width="205" height="120" rx="18" fill="#b77de9"/>
    <rect x="630" y="200" width="240" height="120" rx="18" fill="#5bb7d9"/>
    <rect x="945" y="215" width="195" height="90" rx="18" fill="#4cbf9f"/>
  </g>
  <g font-family="Inter,Arial,sans-serif" text-anchor="middle">
    <g fill="#fff" font-size="18" font-weight="700"><text x="162" y="248">POST /ai/run</text><text x="447" y="248">NoToolStep</text><text x="750" y="248">ExtractInvoiceStep</text><text x="1042" y="253">HTTP 200</text></g>
    <g font-size="12"><text x="162" y="275" fill="#e7f4fb">InvoiceFlow + fileName</text><text x="447" y="275" fill="#f7edff">parse JSON and route</text><text x="750" y="275" fill="#e7f4fb">multimodal extraction</text><text x="1042" y="278" fill="#e0f8ee">application/json</text></g>
  </g>
  <g font-family="Inter,Arial,sans-serif" font-size="13" fill="#d6e0e8"><text x="281" y="247">start</text><text x="565" y="247">state</text><text x="881" y="247">direct JSON</text><text x="654" y="446" fill="#f5c76d">fetch_file → upload → go(Self).withMessage(file part)</text></g>
  <g font-family="Inter,Arial,sans-serif"><rect x="60" y="530" width="170" height="34" rx="17" fill="#263744"/><text x="145" y="552" fill="#cddbe5" text-anchor="middle" font-size="13">Google model adapter</text><rect x="248" y="530" width="196" height="34" rx="17" fill="#263744"/><text x="346" y="552" fill="#cddbe5" text-anchor="middle" font-size="13">self re-entry, no hooks</text><rect x="462" y="530" width="190" height="34" rx="17" fill="#263744"/><text x="557" y="552" fill="#cddbe5" text-anchor="middle" font-size="13">flow.markCompleted()</text></g>
</svg>
