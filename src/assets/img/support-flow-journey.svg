<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">SupportFlow workflow</title><desc id="desc">Triage verifies an order and routes either returns or billing work. Return policy is applied by a deterministic adjudication step and may require approval. Billing creates an escalation ticket. Both return to triage before terminal completion.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#18242e"/><stop offset="1" stop-color="#0d1218"/></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#54bee8"/><stop offset="1" stop-color="#6979e9"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 8 4.5 0 9Z" fill="#97a9b8"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#000" flood-opacity=".28"/></filter></defs>
  <rect width="1200" height="720" rx="30" fill="url(#bg)"/><g fill="none" stroke="#2b3b49" opacity=".7"><path d="M0 120H1200M0 240H1200M0 360H1200M0 480H1200M0 600H1200"/><path d="M120 0V720M240 0V720M360 0V720M480 0V720M600 0V720M720 0V720M840 0V720M960 0V720M1080 0V720"/></g>
  <text x="54" y="64" fill="#f3f7fa" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700">SupportFlow case journey</text><text x="54" y="94" fill="#9cafbe" font-family="Inter,Arial,sans-serif" font-size="16">Triage owns the verified case. Deterministic workers decide returns and create billing tickets before control returns to the hub.</text>
  <g fill="none" stroke="#97a9b8" stroke-width="3" marker-end="url(#arrow)"><path d="M235 274H310"/><path d="M450 274H525"/><path d="M665 274H740"/><path d="M880 274C990 274 990 155 155 155V224"/><path d="M155 324V488"/><path d="M235 548H310"/><path d="M450 548C560 548 560 415 155 415V324"/><path d="M235 324H260V650H740"/></g>
  <g filter="url(#shadow)"><rect x="75" y="224" width="160" height="100" rx="18" fill="url(#blue)"/><rect x="310" y="224" width="140" height="100" rx="18" fill="#5bb7d9"/><rect x="525" y="224" width="140" height="100" rx="18" fill="#314958" stroke="#7b99ab" stroke-width="2"/><rect x="740" y="224" width="140" height="100" rx="18" fill="#f4c866"/><rect x="75" y="488" width="160" height="112" rx="18" fill="#5bb7d9"/><rect x="310" y="488" width="140" height="112" rx="18" fill="#314958" stroke="#7b99ab" stroke-width="2"/><rect x="740" y="600" width="140" height="70" rx="18" fill="#4cbf9f"/></g>
  <g font-family="Inter,Arial,sans-serif" text-anchor="middle"><g fill="#fff" font-size="18" font-weight="700"><text x="155" y="262">Triage</text><text x="380" y="262">Returns</text><text x="595" y="262">Adjudicate</text><text x="810" y="262" fill="#27313d">Approval</text><text x="155" y="526">Billing</text><text x="380" y="526">Escalate</text><text x="810" y="642">Complete</text></g><g font-size="12"><text x="155" y="287" fill="#e7f4fb">verify + route</text><text x="380" y="287" fill="#e7f4fb">request facts</text><text x="595" y="287" fill="#dce9f1">policy code</text><text x="810" y="287" fill="#70561b">confirm quote</text><text x="155" y="552" fill="#e7f4fb">dispute facts</text><text x="380" y="552" fill="#dce9f1">ticket code</text><text x="810" y="662" fill="#e0f8ee">terminal</text></g></g>
  <g font-family="Inter,Arial,sans-serif" font-size="13" fill="#d6e0e8"><text x="260" y="265">return</text><text x="470" y="265">policy</text><text x="685" y="265">review</text><text x="354" y="465">commit or decline → triage</text><text x="260" y="540">billing</text><text x="470" y="540">ticket → triage</text><text x="490" y="645">close with committed outcomes</text></g>
</svg>
