<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Employee benefits enrollment journey</title>
  <desc id="desc">A flow from eligibility, household, and preferences through deterministic plan evaluation, medical, account, ancillary, beneficiary, and dependent-care elections, then review, deterministic commitment, and completion. Ineligible employees leave after eligibility; corrections return to the stage that owns the election.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#18242e"/><stop offset="1" stop-color="#0d1218"/></linearGradient>
    <linearGradient id="collection" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#50bce9"/><stop offset="1" stop-color="#6877e9"/></linearGradient>
    <linearGradient id="election" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c18cf5"/><stop offset="1" stop-color="#8964dc"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#97a9b8"/></marker>
    <marker id="correction" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#f5c76d"/></marker>
  </defs>
  <rect width="1200" height="760" rx="30" fill="url(#background)"/>
  <g fill="none" stroke="#2b3b49" stroke-width="1" opacity=".7"><path d="M0 108H1200M0 216H1200M0 324H1200M0 432H1200M0 540H1200M0 648H1200"/><path d="M120 0V760M240 0V760M360 0V760M480 0V760M600 0V760M720 0V760M840 0V760M960 0V760M1080 0V760"/></g>
  <text x="54" y="64" fill="#f3f7fa" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">Employee benefits enrollment journey</text>
  <text x="54" y="94" fill="#9cafbe" font-family="Inter, Arial, sans-serif" font-size="16">The model guides collection. Code owns eligibility, plan facts, limits, payroll totals, pending requirements, and submission.</text>
  <g fill="none" stroke="#97a9b8" stroke-width="3" marker-end="url(#arrow)"><path d="M216 250H265"/><path d="M426 250H475"/><path d="M636 250H685"/><path d="M846 250H895"/><path d="M975 320V398"/><path d="M1055 458H1080"/><path d="M975 518C975 555 760 540 676 572"/><path d="M676 622H720"/><path d="M840 622H885"/><path d="M1005 622H1050"/></g>
  <g fill="none" stroke="#f5c76d" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#correction)"><path d="M905 570C905 540 795 540 795 570"/><path d="M1070 570C1070 522 960 522 960 570"/></g>
  <g filter="url(#shadow)"><g fill="url(#collection)"><rect x="56" y="180" width="160" height="140" rx="18"/><rect x="266" y="180" width="160" height="140" rx="18"/><rect x="476" y="180" width="160" height="140" rx="18"/></g><rect x="686" y="180" width="160" height="140" rx="18" fill="#2d4150" stroke="#7b99ab" stroke-width="2"/><rect x="896" y="180" width="160" height="140" rx="18" fill="url(#election)"/><rect x="895" y="398" width="160" height="120" rx="18" fill="url(#election)"/><rect x="1080" y="398" width="84" height="120" rx="18" fill="#f29c68"/><rect x="516" y="572" width="160" height="100" rx="18" fill="url(#election)"/><rect x="720" y="572" width="120" height="100" rx="18" fill="url(#election)"/><rect x="885" y="572" width="120" height="100" rx="18" fill="#f4c866"/><rect x="1050" y="572" width="114" height="100" rx="18" fill="#4cbf9f"/></g>
  <g font-family="Inter, Arial, sans-serif" text-anchor="middle"><g font-size="18" font-weight="700" fill="#fff"><text x="136" y="233">Eligibility</text><text x="346" y="233">Household</text><text x="556" y="233">Preferences</text><text x="766" y="233">Plan evaluation</text><text x="976" y="233">Medical plan</text><text x="975" y="444">Health account</text><text x="1122" y="444">Ineligible</text><text x="596" y="610">Ancillary</text><text x="780" y="610">Beneficiaries</text><text x="945" y="610" fill="#27313d">Review</text><text x="1107" y="610">Commit / End</text></g><g font-size="12" fill="#e7f4fb"><text x="136" y="261">request · decision</text><text x="346" y="261">tier · dependents</text><text x="556" y="261">priorities</text></g><g font-size="12" fill="#dce9f1"><text x="766" y="261">deterministic code</text><text x="976" y="261">network · select</text><text x="975" y="473">HSA / FSA limits</text><text x="1122" y="473">no enrollment</text><text x="596" y="638">dental · vision · life</text><text x="780" y="638">total = 100%</text><text x="945" y="638" fill="#70561b">correct / confirm</text><text x="1107" y="638">record · complete</text></g></g>
  <g font-family="Inter, Arial, sans-serif" font-size="13" fill="#d6e0e8"><circle cx="58" cy="714" r="5" fill="#71b6ea"/><text x="72" y="719">model-guided collection</text><circle cx="280" cy="714" r="5" fill="#b27be9"/><text x="294" y="719">election stage</text><circle cx="418" cy="714" r="5" fill="#f4c866"/><text x="432" y="719">review gate</text><path d="M578 714h28" stroke="#f5c76d" stroke-width="3" stroke-dasharray="7 6"/><text x="618" y="719">correction stays with state owner</text></g>
</svg>
