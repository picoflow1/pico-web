<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">HotelFlow workflow</title><desc id="desc">Explore collects hotel criteria and searches. Present shows results and can return to Explore or enter Compare. Compare renders direct tables, returns to Present, or ends in a reservation confirmation.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#18242e"/><stop offset="1" stop-color="#0d1218"/></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#54bee8"/><stop offset="1" stop-color="#6979e9"/></linearGradient><linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c28cf4"/><stop offset="1" stop-color="#8964dd"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 8 4.5 0 9Z" fill="#97a9b8"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#000" flood-opacity=".28"/></filter></defs>
  <rect width="1200" height="610" rx="30" fill="url(#bg)"/><g fill="none" stroke="#2b3b49" opacity=".7"><path d="M0 120H1200M0 240H1200M0 360H1200M0 480H1200"/><path d="M120 0V610M240 0V610M360 0V610M480 0V610M600 0V610M720 0V610M840 0V610M960 0V610M1080 0V610"/></g>
  <text x="54" y="64" fill="#f3f7fa" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700">HotelFlow booking journey</text><text x="54" y="94" fill="#9cafbe" font-family="Inter,Arial,sans-serif" font-size="16">One durable cursor moves between criteria collection, results, comparisons, and the terminal reservation.</text>
  <g fill="none" stroke="#97a9b8" stroke-width="3" marker-end="url(#arrow)"><path d="M390 260H514"/><path d="M686 260H810"/><path d="M600 330C600 408 306 408 306 330"/><path d="M896 330C896 408 694 408 694 330"/><path d="M982 260H1030"/></g><g fill="none" stroke="#f5c76d" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"><path d="M306 190C306 144 230 144 230 190"/><path d="M896 330C896 373 940 373 940 330"/></g>
  <g filter="url(#shadow)"><rect x="220" y="190" width="170" height="140" rx="18" fill="url(#blue)"/><rect x="514" y="190" width="172" height="140" rx="18" fill="#f4c866"/><rect x="810" y="190" width="172" height="140" rx="18" fill="url(#purple)"/><rect x="1030" y="190" width="115" height="140" rx="18" fill="#4cbf9f"/></g>
  <g font-family="Inter,Arial,sans-serif" text-anchor="middle"><g fill="#fff" font-size="20" font-weight="700"><text x="305" y="239">Explore</text><text x="600" y="239" fill="#27313d">Present</text><text x="896" y="239">Compare</text><text x="1087" y="239">Book</text></g><g font-size="13"><text x="305" y="270" fill="#e7f4fb">criteria + MCP search</text><text x="600" y="270" fill="#70561b">results + next action</text><text x="896" y="270" fill="#f5ecfb">exact direct table</text><text x="1087" y="270" fill="#e0f8ee">terminal</text></g></g>
  <g font-family="Inter,Arial,sans-serif" font-size="13" fill="#d6e0e8"><text x="430" y="250">found hotels</text><text x="735" y="250">compare</text><text x="1002" y="250">choose</text><text x="350" y="390" fill="#f5c76d">re-run search with last message</text><text x="865" y="390" fill="#f5c76d">direct() stays on Compare</text></g>
  <g font-family="Inter,Arial,sans-serif" font-size="13" fill="#d6e0e8"><circle cx="56" cy="560" r="5" fill="#71b6ea"/><text x="70" y="565">model-guided stage</text><circle cx="238" cy="560" r="5" fill="#f4c866"/><text x="252" y="565">presentation route</text><circle cx="436" cy="560" r="5" fill="#b27be9"/><text x="450" y="565">code-rendered response</text></g>
</svg>
