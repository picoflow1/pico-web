<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">DecisionHotelFlow booking journey</title>
  <desc id="desc">RouterStep uses a typed decision to send requests to one of five criterion collectors. Saved criteria return to the router, which sends complete records through a readiness decision and deterministic hotel search. PresentStep drafts hotel results for a presentation decision, can return revisions to the router, or validates a hotel selection and completes the booking.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#18242e"/><stop offset="1" stop-color="#0d1218"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#54bee8"/><stop offset="1" stop-color="#6979e9"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c28cf4"/><stop offset="1" stop-color="#8964dd"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4ec7a1"/><stop offset="1" stop-color="#319a78"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 8 4.5 0 9Z" fill="#97a9b8"/></marker>
    <marker id="warnArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 8 4.5 0 9Z" fill="#f5c76d"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#000" flood-opacity=".28"/></filter>
  </defs>

  <rect width="1200" height="700" rx="30" fill="url(#bg)"/>
  <g fill="none" stroke="#2b3b49" opacity=".7"><path d="M0 116H1200M0 232H1200M0 348H1200M0 464H1200M0 580H1200"/><path d="M120 0V700M240 0V700M360 0V700M480 0V700M600 0V700M720 0V700M840 0V700M960 0V700M1080 0V700"/></g>

  <text x="54" y="64" fill="#f3f7fa" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700">DecisionHotelFlow booking journey</text>
  <text x="54" y="94" fill="#9cafbe" font-family="Inter,Arial,sans-serif" font-size="16">Typed Jev decisions route and review; conversational Steps collect and present; code validates, searches, and books.</text>

  <g fill="none" stroke="#97a9b8" stroke-width="3" marker-end="url(#arrow)">
    <path d="M220 329H283"/>
    <path d="M510 329H553V257H602"/>
    <path d="M786 257H823"/>
    <path d="M967 257H1004"/>
    <path d="M1082 326V418H929V391"/>
    <path d="M1010 481H1082V326"/>
    <path d="M1082 326V542"/>
  </g>
  <g fill="none" stroke="#f5c76d" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#warnArrow)">
    <path d="M383 525V570H137V385"/>
    <path d="M695 312V360H420V525"/>
    <path d="M895 312V590H220V385"/>
    <path d="M1082 326V375H220V385"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="54" y="274" width="166" height="111" rx="18" fill="url(#purple)"/>
    <rect x="282" y="151" width="228" height="374" rx="22" fill="#1a2a36" stroke="#63819a" stroke-width="2"/>
    <rect x="602" y="202" width="184" height="110" rx="18" fill="url(#purple)"/>
    <rect x="823" y="202" width="144" height="110" rx="18" fill="#f4c866"/>
    <rect x="1004" y="202" width="156" height="124" rx="18" fill="url(#blue)"/>
    <rect x="796" y="391" width="214" height="90" rx="18" fill="url(#purple)"/>
    <rect x="1004" y="542" width="156" height="84" rx="18" fill="url(#green)"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="306" y="194" width="180" height="45" rx="11" fill="#27506b"/>
    <rect x="306" y="254" width="180" height="45" rx="11" fill="#27506b"/>
    <rect x="306" y="314" width="180" height="45" rx="11" fill="#27506b"/>
    <rect x="306" y="374" width="180" height="45" rx="11" fill="#27506b"/>
    <rect x="306" y="434" width="180" height="45" rx="11" fill="#27506b"/>
  </g>

  <g font-family="Inter,Arial,sans-serif" text-anchor="middle">
    <g fill="#fff" font-size="18" font-weight="700">
      <text x="137" y="315">RouterStep</text>
      <text x="694" y="243">Readiness judge</text>
      <text x="895" y="243" fill="#27313d">Search hotels</text>
      <text x="1082" y="243">PresentStep</text>
      <text x="903" y="430">Presentation judge</text>
      <text x="1082" y="577">Book</text>
    </g>
    <g font-size="12" font-weight="600">
      <text x="137" y="342" fill="#f5ecfb">DecisionStep</text>
      <text x="694" y="270" fill="#f5ecfb">DecisionStep</text>
      <text x="895" y="270" fill="#70561b">LogicStep</text>
      <text x="1082" y="271" fill="#e7f4fb">draft + selection</text>
      <text x="903" y="457" fill="#f5ecfb">DecisionStep</text>
      <text x="1082" y="602" fill="#e0f8ee">finish()</text>
    </g>
    <g fill="#e7f4fb" font-size="13" font-weight="600">
      <text x="396" y="221">Date range</text>
      <text x="396" y="281">Budget</text>
      <text x="396" y="341">Room type</text>
      <text x="396" y="401">Amenities</text>
      <text x="396" y="461">Distance</text>
    </g>
    <text x="396" y="177" fill="#b8cad8" font-size="15" font-weight="700">Criterion collectors</text>
    <text x="396" y="501" fill="#8fa8bb" font-size="12">ordinary Steps · shared intake memory</text>
  </g>

  <g font-family="Inter,Arial,sans-serif" font-size="12" fill="#d6e0e8">
    <text x="231" y="316">typed route</text>
    <text x="526" y="244">complete</text>
    <text x="793" y="244">valid</text>
    <text x="972" y="244">results</text>
    <text x="934" y="374">draft</text>
    <text x="1020" y="364">approved or exact fallback</text>
    <text x="1095" y="520">validated choice</text>
    <text x="285" y="562" fill="#f5c76d">save or reroute request</text>
    <text x="492" y="347" fill="#f5c76d">correction</text>
    <text x="635" y="580" fill="#f5c76d">no results or service notice</text>
    <text x="538" y="390" fill="#f5c76d">revision</text>
  </g>

  <g font-family="Inter,Arial,sans-serif" font-size="13" fill="#d6e0e8">
    <circle cx="54" cy="662" r="5" fill="#70b6ea"/><text x="68" y="667">chat-model Step</text>
    <circle cx="233" cy="662" r="5" fill="#b27be9"/><text x="247" y="667">typed Jev decision</text>
    <circle cx="446" cy="662" r="5" fill="#f4c866"/><text x="460" y="667">deterministic operation</text>
    <circle cx="680" cy="662" r="5" fill="#4ec7a1"/><text x="694" y="667">terminal booking</text>
    <path d="M882 662h29" stroke="#f5c76d" stroke-width="3" stroke-dasharray="7 7"/><text x="922" y="667">correction or recovery path</text>
  </g>
</svg>
